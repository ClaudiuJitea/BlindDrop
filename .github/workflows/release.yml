# Every push and pull request builds the game for Linux and Windows and runs the
# proof gate. Releases ship the Linux and Windows binaries.
# A release is published ONLY when a v* tag is pushed, so nothing reaches
# players by accident. The game has no updater: players download a release
# themselves and can check it against SHA256SUMS.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    # trixie is the mainstream image where gcc and mingw both accept -std=c23.
    # Actions and the image are pinned by digest: they run with the release
    # token, so a moved tag must not be able to change what they execute.
    container: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    steps:
      # Before checkout: actions/checkout needs git in the container.
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential git ca-certificates \
            libegl-dev libgl-dev libx11-dev \
            libgl1-mesa-dri libglx-mesa0 libegl1 libgl1 libx11-6 \
            gcc-mingw-w64-x86-64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          V=dev
          if [ "$REF_TYPE" = tag ]; then V="$REF_NAME"; fi
          make all BUILD_VERSION="$V" BUILD_COMMIT="$(echo "$SHA" | cut -c1-7)"
          mv build/game-x86_64 blinddrop-linux-amd64
          mv build/game.exe blinddrop-windows-amd64.exe

      # Warning gate WITHOUT LTO (-flto swallows -Wformat-truncation), then the
      # self-contained proof gate. The build that ships is proved.
      - name: Gate
        run: |
          gcc -std=c23 -O2 -Wall -Wextra -Werror -c code/game.c -o /dev/null
          x86_64-w64-mingw32-gcc -std=c23 -O2 -Wall -Wextra -Werror -c code/game.c -o /dev/null
          ./tools/ci-proofs.sh ./blinddrop-linux-amd64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: assets, path: blinddrop-*, if-no-files-found: error }

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: assets, path: dist }
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/blinddrop-linux-*
          ( cd dist && sha256sum blinddrop-* > SHA256SUMS )
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file .github/release-body.md
